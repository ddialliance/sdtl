name: Pull request CI

on: pull_request

jobs:
  build:
    if: github.repository == 'ddialliance/sdtl'
    runs-on: windows-latest

    steps:
    - name: Set build paths and short SHA
      shell: pwsh
      run: |
        $shortSha = '${{ github.sha }}'.Substring(0, 8)
        "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SDTL_OUTPUT_ROOT=$(Join-Path $env:RUNNER_TEMP 'sdtl-outputs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SDTL_PACKAGE_ROOT=$(Join-Path $env:RUNNER_TEMP "sdtl-$shortSha")" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "SDTL_ARCHIVE_PATH=$(Join-Path $env:RUNNER_TEMP "sdtl-outputs-$shortSha.zip")" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Install cogs dotnet tool
      run: dotnet tool install --global cogs

    - name: Set up python
      id: python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: build/requirements.txt
    
    - name: Install python dependencies
      shell: pwsh
      env:
        COGS_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        & $env:COGS_PYTHON -m pip install -r build/requirements.txt
        if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed with exit $LASTEXITCODE" }
        "COGS_PYTHON=$env:COGS_PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


    - name: Install other dependencies
      run: .\build\install-dependencies.ps1
      shell: pwsh

    - name: Run build-windows.bat
      run: .\build\build-windows.bat
      shell: cmd

    - name: Package outputs
      shell: pwsh
      run: |
        foreach ($file in @('xsd/schema.xsd', 'json/jsonSchema.json', 'uml/sdtl.xmi', 'owl/sdtl.ttl', 'owl/sdtl.owl.ttl', 'owl/sdtl.shacl', 'owl/sdtl.shex', 'sphinx/build/dirhtml/index.html')) {
          if (-not (Test-Path -LiteralPath (Join-Path $env:SDTL_OUTPUT_ROOT $file) -PathType Leaf)) {
            throw "Required build artifact is missing: $file"
          }
        }
        New-Item -ItemType Directory -Path $env:SDTL_PACKAGE_ROOT | Out-Null
        foreach ($directory in @('xsd', 'json', 'owl', 'uml')) {
          $destination = if ($directory -eq 'owl') { 'rdf' } else { $directory }
          Copy-Item -LiteralPath (Join-Path $env:SDTL_OUTPUT_ROOT $directory) `
            -Destination (Join-Path $env:SDTL_PACKAGE_ROOT $destination) -Recurse
        }
        7z a -tzip $env:SDTL_ARCHIVE_PATH (Join-Path $env:SDTL_OUTPUT_ROOT '*')
        if ($LASTEXITCODE -ne 0) { throw "Output archiving failed with exit $LASTEXITCODE" }

    - name: Make all outputs artifact
      uses: actions/upload-artifact@v7.0.1
      with:
          name: sdtl-outputs-${{env.SHORT_SHA}}
          path: ${{ env.SDTL_ARCHIVE_PATH }}
          if-no-files-found: error

    - name: Make package artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: sdtl-${{env.SHORT_SHA}}
        path: ${{ env.SDTL_PACKAGE_ROOT }}
        if-no-files-found: error
